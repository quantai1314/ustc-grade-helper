<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USTC评教助手 - 规则设置</title>
<style>
  .ugh-options { color: #22344e; background: #fff; padding: 8px 20px 20px;
    font: 13px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    color-scheme: light; }
  body.ugh-options { max-width: 820px; margin: 24px auto; padding: 24px; }
  .ugh-options, .ugh-options * { box-sizing: border-box; }
  .ugh-options h1 { margin: 0 0 6px; color: #172b49; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
  .ugh-options p { margin: 0; }
  .ugh-options .options-intro { margin-bottom: 20px; color: #63728a; }
  .ugh-options .options-intro strong { font-weight: 600; color: #3d506c; }
  .ugh-options .rules-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed;
    border: 1px solid #e0e8f3; border-radius: 12px; overflow: hidden; }
  .ugh-options th { padding: 10px 8px; background: #f3f7fc; color: #576982; font-size: 12px;
    font-weight: 600; text-align: left; }
  .ugh-options th:first-child { width: 52px; text-align: center; }
  .ugh-options th:nth-child(2) { width: 32%; }
  .ugh-options th:nth-child(3) { width: 23%; }
  .ugh-options th:last-child { width: 62px; }
  .ugh-options td { padding: 11px 7px; border-top: 1px solid #e9eef6; vertical-align: middle; }
  .ugh-options tbody tr:hover { background: #fafcff; }
  .ugh-options .rule-enabled { text-align: center; }
  .ugh-options .rule-toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .ugh-options .rule-toggle span, .ugh-options .rule-order { display: none; }
  .ugh-options .rule-field { display: block; min-width: 0; }
  .ugh-options .field-label, .ugh-options .sr-only { position: absolute; width: 1px; height: 1px;
    padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .ugh-options input, .ugh-options select, .ugh-options button { font: inherit; }
  .ugh-options input[type=text], .ugh-options select { display: block; width: 100%; min-width: 0;
    padding: 9px 10px; border: 1px solid #d6e1ee; border-radius: 8px; background: #fff; color: #233954; }
  .ugh-options input::placeholder { color: #8694a9; }
  .ugh-options input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: #2563eb; cursor: pointer; }
  .ugh-options button { padding: 9px 15px; border: 1px solid #2563eb; border-radius: 8px;
    background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
  .ugh-options button:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .ugh-options button.ghost { background: #fff; color: #365d8e; border-color: #d7e2ef; }
  .ugh-options button.ghost:hover { background: #f1f6fd; border-color: #a9c2e7; color: #1d4ed8; }
  .ugh-options button.del { padding: 6px 7px; border-color: transparent; color: #79879a; font-size: 12px; font-weight: 400; }
  .ugh-options button.del:hover { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
  .ugh-options button:disabled, .ugh-options input:disabled, .ugh-options select:disabled { opacity: .5; cursor: default; }
  .ugh-options :focus-visible { outline: 3px solid #aac7fb; outline-offset: 2px; }
  .ugh-options .row { margin: 16px 0 0; }
  .ugh-options .add-rule { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .ugh-options .field-help { color: #75839a; font-size: 12px; }
  .ugh-options .fallback-setting { display: grid; grid-template-columns: 1fr minmax(0, 290px); gap: 12px 18px;
    align-items: center; padding: 16px; border: 1px solid #e2eaf5; border-radius: 12px; background: #f8fafd; }
  .ugh-options .fallback-label { display: block; margin-bottom: 3px; color: #344b69; font-weight: 600; }
  .ugh-options .options-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding-top: 18px; border-top: 1px solid #e8eef6; }
  .ugh-options #msg { flex-basis: 100%; color: #4e6481; font-size: 12px; overflow-wrap: anywhere; }
  .ugh-options #msg:empty { display: none; }
  @media (max-width: 600px) {
    .ugh-options { padding: 8px 16px 16px; }
    body.ugh-options { margin: 0; padding: 20px 16px; }
    .ugh-options .options-intro { margin-bottom: 16px; }
    .ugh-options .rules-table { display: block; border: 0; overflow: visible; }
    .ugh-options thead { display: none; }
    .ugh-options tbody { display: grid; gap: 12px; counter-reset: rule; }
    .ugh-options tbody tr { position: relative; display: grid; grid-template-columns: minmax(0, 1fr);
      gap: 11px; padding: 13px; border: 1px solid #dfe8f4; border-radius: 12px; counter-increment: rule; }
    .ugh-options td { display: block; min-width: 0; padding: 0; border: 0; }
    .ugh-options .rule-enabled { display: flex; align-items: center; gap: 10px; min-height: 29px; padding-right: 52px; }
    .ugh-options .rule-order { display: inline-flex; align-items: center; justify-content: center;
      min-width: 25px; height: 25px; border-radius: 7px; background: #eaf2ff; color: #3564a5; font-size: 12px; font-weight: 600; }
    .ugh-options .rule-order::before { content: counter(rule, decimal-leading-zero); }
    .ugh-options .rule-toggle span { display: inline; color: #506580; font-size: 12px; }
    .ugh-options .field-label { position: static; display: block; width: auto; height: auto; margin-bottom: 5px;
      overflow: visible; clip: auto; white-space: normal; color: #657891; font-size: 12px; }
    .ugh-options .rule-actions { position: absolute; top: 12px; right: 12px; }
    .ugh-options .fallback-setting { grid-template-columns: minmax(0, 1fr); padding: 14px; }
    .ugh-options .add-rule { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body class="ugh-options">
  <h1>规则设置</h1>
  <p class="options-intro"><strong>从上到下匹配，命中第一条后停止。</strong><br>多个题目关键词用英文逗号分隔，任一命中即可。</p>
  <table class="rules-table" aria-label="填写规则，按显示顺序匹配">
    <thead><tr><th scope="col">启用</th><th scope="col">题目包含</th><th scope="col">填写策略</th><th scope="col">策略参数</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead>
    <tbody id="rules"></tbody>
  </table>
  <div class="row add-rule"><button id="add" class="ghost" type="button">+ 添加规则</button><span class="field-help">选「包含关键词」或「填充文本」时填写策略参数。</span></div>
  <div class="row fallback-setting">
    <div><label class="fallback-label" for="unmatched">未匹配的必答题</label><p class="field-help" id="unmatched-help">没有命中上述规则时，如何处理必答题。</p></div>
    <select id="unmatched" aria-describedby="unmatched-help">
      <option value="highlight">仅高亮提醒，手动填写（默认）</option>
      <option value="best">自动选最高档选项</option>
    </select>
  </div>
  <div class="row options-actions">
    <button id="save" type="button">保存规则</button>
    <button id="reset" class="ghost" type="button">恢复默认</button>
    <span id="msg" role="status" aria-live="polite"></span>
  </div>
  <script src="../content/engine.js"></script>
  <script src="options.js"></script>
</body>
</html>
