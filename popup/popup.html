<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { width: 360px; margin: 0; padding: 18px; box-sizing: border-box; background: #fff; color: #21304a; font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .ugh-popup * { box-sizing: border-box; }
  .ugh-popup [hidden] { display: none !important; }
  .ugh-popup .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .ugh-popup .app-icon { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #dce6fb; border-radius: 12px; background: #eff4ff; color: #365fce; flex-shrink: 0; }
  .ugh-popup h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.4px; line-height: 1.4; }
  .ugh-popup .subtitle { margin: 3px 0 0; color: #63728a; font-size: 12px; }
  .ugh-popup .status-card { padding: 14px 16px; border: 1px solid #dfe7f4; border-radius: 12px; background: #f5f8ff; }
  .ugh-popup .status-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #51627d; font-size: 12px; font-weight: 600; }
  .ugh-popup #counter { color: #365fce; font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .ugh-popup progress { display: block; appearance: none; width: 100%; height: 6px; margin: 12px 0 10px; border: 0; border-radius: 8px; overflow: hidden; background: #e1e8f5; accent-color: #4169d5; }
  .ugh-popup progress::-webkit-progress-bar { background: #e1e8f5; border-radius: 8px; }
  .ugh-popup progress::-webkit-progress-value { background: #4169d5; border-radius: 8px; }
  .ugh-popup progress::-moz-progress-bar { background: #4169d5; border-radius: 8px; }
  .ugh-popup .stat { color: #425570; font-size: 12px; }
  .ugh-popup .warn { color: #945c1e; }
  .ugh-popup #coverage { color: #62728b; font-size: 12px; margin-top: 3px; }
  .ugh-popup #unmatched { font-size: 12px; color: #885619; background: #fff8eb; border-radius: 6px; padding: 7px 9px; max-height: 84px; overflow: auto; overflow-wrap: anywhere; margin-top: 9px; }
  .ugh-popup #unmatched:empty { display: none; }
  .ugh-popup .preset { margin: 16px 0; }
  .ugh-popup .preset-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .ugh-popup #preset-name { font-size: 13px; font-weight: 600; }
  .ugh-popup .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ugh-popup .chips span { padding: 4px 8px; border: 1px solid #e8ecf3; border-radius: 6px; background: #f8f9fc; color: #53627b; font-size: 12px; }
  .ugh-popup .chips b { color: #304766; font-weight: 600; }
  .ugh-popup .preset-caption { margin: 8px 0 0; color: #63728a; font-size: 12px; }
  .ugh-popup button { font: inherit; cursor: pointer; border-radius: 9px; }
  .ugh-popup :focus-visible { outline: 3px solid #a8bff7; outline-offset: 3px; }
  .ugh-popup button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .ugh-popup #settings { padding: 3px 0 3px 8px; border: 0; background: transparent; color: #365fce; font-size: 12px; }
  .ugh-popup #settings:hover:not(:disabled) { text-decoration: underline; }
  .ugh-popup #apply { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 45px; padding: 10px 12px; border: 1px solid #365fce; background: #3f66d5; color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 3px 8px #294caa1a; }
  .ugh-popup #apply:hover:not(:disabled) { background: #3156bc; }
  .ugh-popup .action-hint { margin: 7px 0 0; text-align: center; color: #62728b; font-size: 12px; }
  .ugh-popup #msg { margin: 10px 0 0; padding: 9px 11px; border-radius: 7px; background: #edf4ff; font-size: 12px; color: #34558e; overflow-wrap: anywhere; }
  .ugh-popup #msg:empty { display: none; }
  .ugh-popup .batch-section { margin-top: 16px; padding: 13px; border: 1px solid #e3e8f0; border-radius: 10px; }
  .ugh-popup .batch-actions { display: flex; align-items: stretch; gap: 8px; }
  .ugh-popup #batch { flex: 1; min-width: 0; min-height: 38px; padding: 7px 10px; border: 1px solid #cfdbf6; background: #f0f4ff; color: #3658b3; font-size: 13px; font-weight: 600; }
  .ugh-popup #batch:hover:not(:disabled) { background: #e5edff; }
  .ugh-popup #stop-batch { padding: 7px 13px; border: 1px solid #e7bdb6; background: #fff4f1; color: #a33e2d; font-size: 13px; font-weight: 600; }
  .ugh-popup #stop-batch:hover:not(:disabled) { background: #ffe8e2; }
  .ugh-popup .batch-note { margin: 8px 0 0; color: #63728a; font-size: 12px; }
  .ugh-popup #batch-state { margin: 9px 0 0; padding-top: 9px; border-top: 1px solid #e6ebf4; color: #425570; font-size: 12px; overflow-wrap: anywhere; }
  .ugh-popup #batch-state:empty { display: none; }
  .ugh-popup #batch-state.running { color: #365fce; }
  .ugh-popup #batch-state.completed { color: #22734e; }
  .ugh-popup #batch-state.error { color: #a33e2d; }
  .ugh-popup details { margin-top: 14px; }
  .ugh-popup summary { min-height: 30px; align-items: center; color: #53627b; cursor: pointer; font-size: 12px; list-style: none; display: flex; justify-content: space-between; }
  .ugh-popup summary::-webkit-details-marker { display: none; }
  .ugh-popup summary::after { content: '⌄'; font-size: 17px; line-height: 1; }
  .ugh-popup details[open] summary::after { content: '⌃'; }
  .ugh-popup .secondary-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .ugh-popup .secondary-actions button { min-height: 36px; padding: 7px; border: 1px solid #dce3ed; background: #fff; color: #4c5f7c; font-size: 12px; }
  .ugh-popup .secondary-actions button:hover:not(:disabled) { background: #f4f7fd; }
  .ugh-popup #refill { grid-column: 1 / -1; }
  .ugh-popup .auto { display: flex; align-items: flex-start; gap: 7px; margin-top: 12px; color: #63728a; font-size: 12px; cursor: pointer; }
  .ugh-popup input { accent-color: #4169d5; margin: 3px 0 0; flex-shrink: 0; }
  @media (prefers-reduced-motion: no-preference) { .ugh-popup button { transition: background .15s, box-shadow .15s; } .ugh-popup progress::-webkit-progress-value { transition: width .2s; } }
</style>
</head>
<body class="ugh-popup">
  <header class="hero">
    <div class="app-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M9 5H6a2 2 0 0 0-2 2v13h16V7a2 2 0 0 0-2-2h-3M9 3h6v4H9V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8 13 3 3 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><h1>USTC评教助手</h1><p class="subtitle">按实际评价填写，提交前请核对</p></div>
  </header>
  <section class="status-card" aria-label="当前问卷进度">
    <div class="status-top"><span>当前问卷 · 已填写</span><strong id="counter">—/—</strong></div>
    <progress id="progress" value="0" max="1" aria-label="问卷填写进度"></progress>
    <div class="stat" id="status">正在读取问卷…</div>
    <div id="coverage"></div><div id="unmatched"></div>
  </section>
  <section class="preset" aria-label="当前填写模板">
    <div class="preset-title"><span id="preset-name">默认模板</span><button id="settings">自定义规则 <span aria-hidden="true">→</span></button></div>
    <div class="chips" id="preset-values"><span>评价 <b>非常好</b></span><span>难度 / 内容 / 进度 <b>适中</b></span><span>助教改进 <b>作业反馈</b></span></div>
    <p class="preset-caption" id="preset-caption">PPT为主、板书为辅 · 课外1–2小时 · 教师改进：师生交流</p>
  </section>
  <button id="apply" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13 3-8 11h6l-1 7 9-12h-7l1-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>一键速填</button>
  <p class="action-hint">只补空白，保留已有答案 · 默认不提交</p>
  <div id="msg" role="status" aria-live="polite"></div>
  <section class="batch-section" aria-label="当前任务批量提交">
    <div class="batch-actions"><button id="batch" disabled>全部速填并提交</button><button id="stop-batch" hidden disabled>停止</button></div>
    <p class="batch-note">自动提交当前任务的所有教师、课程问卷，保留已有答案；遇到缺答或失败会停止。</p>
    <div id="batch-state" role="status" aria-live="polite"></div>
  </section>
  <details>
    <summary>更多操作</summary>
    <div class="secondary-actions">
      <button id="preview" disabled>预览待填答案</button><button id="clear" disabled>清除高亮</button>
      <button id="refill" disabled>按模板重填（覆盖已有答案）</button>
    </div>
    <label class="auto"><input type="checkbox" id="autosubmit" disabled> 本次填完后尝试提交，仅对下一次填选生效</label>
  </details>
  <script src="popup.js"></script>
</body>
</html>
